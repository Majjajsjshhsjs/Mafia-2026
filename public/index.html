<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a0b10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="/manifest.json">
<title>Мафия Онлайн</title>
<link rel="stylesheet" href="/css/style.css">
<script src="/socket.io/socket.io.js"></script>
</head>
<body>

<section id="screen-home" class="screen active">
  <div class="home">
    <div class="home-header">
      <div class="brand">
        <div class="brand-mark">♠</div>
        <div>
          <div class="brand-name">МАФИЯ</div>
          <div class="brand-sub">ONLINE · 2026</div>
        </div>
      </div>
      <div class="online-badge"><span class="dot"></span> <span id="onlineCount">0</span></div>
    </div>

    <div class="home-profile">
      <button class="avatar-btn" id="avatarBtn" aria-label="Сменить аватар">♟</button>
      <input id="nickInput" maxlength="16" placeholder="Ник" value="Игрок" autocomplete="off">
      <button class="btn-edit" id="editNick" aria-label="Редактировать ник">✎</button>
    </div>

    <div class="home-actions">
      <button class="menu-btn primary" id="btnCreate">＋ Создать комнату</button>
      <button class="menu-btn" id="btnJoin">➜ Войти по коду</button>
      <button class="menu-btn" id="btnPublic">▦ Публичные комнаты</button>
      <button class="menu-btn ghost" id="btnBots">🤖 Игра с ботами</button>
    </div>

    <div class="home-footer"><small>v1.0 · Mafia Online</small></div>
  </div>
</section>

<section id="screen-lobby" class="screen">
  <div class="lobby">
    <header class="lobby-header">
      <div>
        <h2>Комната <span id="lobbyCode" class="code"></span></h2>
        <p id="lobbySub">Ожидание игроков...</p>
      </div>
      <button class="btn small" id="btnCopyCode">📋 Код</button>
    </header>

    <div class="lobby-body">
      <div class="lobby-players">
        <h3>Игроки <span id="lobbyCount" class="muted"></span></h3>
        <div class="player-grid" id="lobbyPlayers"></div>
      </div>
      <div class="lobby-side">
        <h3>Настройки партии</h3>
        <div id="lobbySettings"></div>
        <button class="menu-btn primary" id="btnStart">▶ Начать игру</button>
        <button class="menu-btn ghost" id="btnLeave">← Покинуть</button>
      </div>
    </div>
  </div>
</section>

<section id="screen-game" class="screen">
  <div class="game">
    <header class="game-header">
      <div class="phase-info">
        <div class="phase-icon" id="phaseIcon">🌙</div>
        <div>
          <div class="phase-title" id="phaseTitle">Ночь 1</div>
          <div class="phase-sub" id="phaseSub">Выберите цель</div>
        </div>
      </div>
      <div class="timer" id="timer">00:45</div>
    </header>

    <div class="game-body">
      <main class="game-main">
        <div class="players-table" id="gamePlayers"></div>
        <div class="game-feed" id="gameFeed"></div>
        <div class="action-bar" id="actionBar">
          <span id="actionHint">Ожидание...</span>
          <div class="action-btns" id="actionButtons"></div>
        </div>
      </main>

      <aside class="game-side">
        <div class="side-tabs">
          <button class="tab active" data-tab="chat">💬 Чат</button>
          <button class="tab" data-tab="role">🎭 Роль</button>
        </div>
        <div class="tab-content" id="chatTab">
          <div class="chat-log" id="chatLog"></div>
          <form class="chat-form" id="chatForm">
            <input id="chatInput" placeholder="Сообщение..." maxlength="180" autocomplete="off" enterkeyhint="send">
            <button type="submit" class="send-btn" aria-label="Отправить">➤</button>
          </form>
        </div>
        <div class="tab-content hidden" id="roleTab">
          <div class="role-card" id="roleCard"></div>
        </div>
      </aside>
    </div>
  </div>
</section>

<div id="modalRoot"></div>
<div id="toastRoot"></div>

<script src="/js/roles.js"></script>
<script src="/js/socket.js"></script>
<script src="/js/adaptive.js"></script>
<script src="/js/ui.js"></script>
<script src="/js/app.js"></script>
</body>
</html>
